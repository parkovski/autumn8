<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/fa/css/all.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"
            integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ=="
            crossorigin="anonymous" defer>
  </script>
</head>
<body>
  <div id="container" class="p-1 overflow-y-auto absolute left-0 right-0
    bottom-0 top-8 mt-1 bg-slate-700">
    <ul id="items"></ul>
  </div>
  <div id="toolbar" class="fixed top-0 left-0 right-0 border-b border-slate-500 p-1 bg-sky-900">
      <div class="float-right">
        <button id="dev" class="w-7 h-7 text-white"
          data-class-on="text-zinc-600 bg-amber-400 hover:bg-amber-300 hover:border hover:border-amber-700"
          data-class-off="hover:bg-sky-700 hover:border hover:border-sky-600">
          <i class="fas fa-code"></i>
        </button>
      </div>
      <button id="back" class="hover:bg-sky-700 hover:border hover:border-sky-600 w-7 h-7">
        <i class="fas fa-arrow-left text-white"></i>
      </button>
      <button id="forward" class="hover:bg-sky-700 hover:border hover:border-sky-600 w-7 h-7">
        <i class="fas fa-arrow-right text-white"></i>
      </button>
      <button id="up" class="hover:bg-sky-700 hover:border hover:border hover:border-sky-600 w-7 h-7">
        <i class="fas fa-arrow-up text-white"></i>
      </button>
      <span id="dirname" class="font-mono"></span>
  </div>
<script src="lib.js"></script>
<script src="events.js"></script>
<script src="controller.js"></script>
<script src="views.js"></script>
<script src="index.js"></script>
</body>
</html>
